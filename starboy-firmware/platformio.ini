; StarBoy firmware — PlatformIO configuration
; Board: Waveshare ESP32-S3-Touch-AMOLED-1.32
; MCU: ESP32-S3-PICO-1-N8R8 (8MB Flash OPI, 8MB PSRAM OPI)

[env:starboy]
; pioarduino: arduino-esp32 3.3.8 / IDF 5.5.4
; Required for GFX Library 1.6.x (Waveshare display stack)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; CPU frequency
board_build.f_cpu = 240000000L

; Flash: 8MB, OPI mode
board_build.flash_mode = qio
board_build.flash_size = 8MB

; PSRAM: 8MB OPI (Octal SPI)
board_build.arduino.memory_type = qio_opi

; Partition scheme: 8MB flash with larger app partition
board_build.partitions = default_8MB.csv

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload
upload_speed = 921600

; Build flags
build_flags =
    -I ${PROJECT_INCLUDE_DIR}
    -DBOARD_HAS_PSRAM
    -DARDUINO_ESP32S3_DEV
    -DCORE_DEBUG_LEVEL=3
    ; Display pins (CO5300 QSPI)
    -DLCD_RESET=8
    -DLCD_TE=9
    -DLCD_CS=10
    -DLCD_SCL=11
    -DLCD_D0=12 -DLCD_D1=13 -DLCD_D2=14 -DLCD_D3=15
    ; Touch pins (CST820 I2C)
    -DTOUCH_INT=6
    -DTOUCH_RST=7
    -DI2C_SDA=47
    -DI2C_SCL=48
    ; Audio pins (ES8311 I2S)
    -DI2S_ASDOUT=40
    -DI2S_LRCK=41
    -DI2S_DSDIN=42
    -DI2S_MCLK=38
    -DI2S_SCLK=39
    -DPA_CTRL=46
    ; Buttons
    -DBTN_PWR=17
    -DBTN_BOOT=0
    ; LVGL config file location
    -DLV_CONF_INCLUDE_SIMPLE

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.5
    lvgl/lvgl@^8.3.11
